name: Quality gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion path
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          short_lived='^(feature|fix|chore|docs|test|refactor)/[a-z0-9][a-z0-9._-]*$'
          hotfix='^hotfix/[a-z0-9][a-z0-9._-]*$'
          release='^release/[a-z0-9][a-z0-9._-]*$'

          case "$BASE_BRANCH" in
            develop)
              [[ "$HEAD_BRANCH" =~ $short_lived || "$HEAD_BRANCH" =~ $hotfix || "$HEAD_BRANCH" == "main" ]]
              ;;
            main)
              [[ "$HEAD_BRANCH" == "develop" || "$HEAD_BRANCH" =~ $release || "$HEAD_BRANCH" =~ $hotfix ]]
              ;;
            *)
              echo "Unsupported target branch: $BASE_BRANCH" >&2
              exit 1
              ;;
          esac || {
            echo "Invalid promotion path: $HEAD_BRANCH -> $BASE_BRANCH" >&2
            echo "Expected feature/fix/chore/docs/test/refactor -> develop -> main, or an approved hotfix path." >&2
            exit 1
          }

  dependency-review:
    name: Dependency and license review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Reject newly introduced high-risk dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: >-
            AGPL-1.0-only,
            AGPL-1.0-or-later,
            AGPL-3.0-only,
            AGPL-3.0-or-later

  vulnerability-scan:
    name: Known vulnerability scan
    # v2.3.8 pinned by commit so a mutable tag cannot change release behavior.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  backend:
    name: Backend and PostgreSQL 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test unit, migration and concurrency gates
        run: ./mvnw -B -ntp -Ppostgres-migration-test,release-audit verify
      - name: Upload backend coverage and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-evidence
          path: |
            code/backend/target/site/jacoco
            code/backend/target/bom.json
            code/backend/target/bom.xml
          if-no-files-found: error
          retention-days: 30
      - name: Build production container
        run: docker build --tag luxury-hotel-backend:ci .
      - name: Scan production container for fixable High/Critical CVEs
        # v0.36.0 pinned by commit; versions before 0.35.0 are intentionally avoided.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: luxury-hotel-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: code/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit all frontend dependencies
        run: pnpm audit --audit-level=high
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: code/frontend/coverage
          if-no-files-found: error
          retention-days: 30
      - run: pnpm run build
      - name: Test public accessibility on desktop and mobile
        run: pnpm run test:e2e:a11y
      - name: Test chatbot customer journey on desktop and mobile
        run: pnpm run test:e2e:chatbot
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-diagnostics
          path: |
            code/frontend/playwright-report
            code/frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
