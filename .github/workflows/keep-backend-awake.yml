name: Check Render backend manually

on:
  # Deliberately manual: recurring probes keep Render and its DB jobs awake,
  # exhausting Neon Free compute even without visitors.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-backend-warm
  cancel-in-progress: true

jobs:
  health-check:
    name: Ping production health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake backend and verify health
        env:
          HEALTH_URL: https://luxury-hotel-backend-c06y.onrender.com/actuator/health
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "$HEALTH_URL")"

          echo "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
          echo "Render backend is healthy."
