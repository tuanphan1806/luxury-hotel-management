name: Check Render backend manually

on:
  # Deliberately manual: recurring probes keep Render and its DB jobs awake,
  # exhausting Neon Free compute even without visitors.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-backend-warm
  cancel-in-progress: true

jobs:
  health-check:
    name: Verify production recovery
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake backend and verify database and public catalog
        env:
          READINESS_URL: https://luxury-hotel-backend-c06y.onrender.com/actuator/health/readiness
          HEALTH_URL: https://luxury-hotel-backend-c06y.onrender.com/actuator/health
          CATALOG_URL: https://luxury-hotel-backend-c06y.onrender.com/api/room-types
          PUBLIC_CATALOG_URL: https://www.luxuryhotelvn.site/catalog_proxy/room-types
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time "$2" "$1"
          }

          # Wait for the application first. A homepage 200 or readiness UP
          # alone does not prove that Neon or the Vercel proxy is usable.
          probe "$READINESS_URL" 210 | jq -e '.status == "UP"' > /dev/null
          probe "$HEALTH_URL" 30 | jq -e '.status == "UP"' > /dev/null
          probe "$CATALOG_URL" 30 | jq -e '.success == true and (.data | type == "array")' > /dev/null
          probe "$PUBLIC_CATALOG_URL" 30 | jq -e '.success == true and (.data | type == "array")' > /dev/null
          echo "Readiness, database health, direct catalog and public catalog passed."
