# Disposable local QA only. No production .env, shared volume, or outbound network.
name: hotel-isolated-qa
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotel_qa
      POSTGRES_USER: hotel_qa
      POSTGRES_PASSWORD: isolated-qa-only
    volumes:
      - qa-data:/var/lib/postgresql/data
    networks: [qa]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hotel_qa -d hotel_qa]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    image: luxury-hotel-backend:isolated-qa
    build:
      context: ./code/backend
    networks: [qa]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/hotel_qa
      DATABASE_USERNAME: hotel_qa
      DATABASE_PASSWORD: isolated-qa-only
      PORT: "8080"
      FRONTEND_BASE_URL: http://localhost:13000
      BACKEND_BASE_URL: http://localhost:19080
      CORS_ALLOWED_ORIGINS: http://localhost:13000,http://127.0.0.1:13000
      APP_AUTH_COOKIE_SECURE: "false"
      APP_SEED_MASTER_DATA_ENABLED: "true"
      APP_SEED_DEMO_USERS_ENABLED: "true"
      APP_SEED_ADD_ON_SERVICES_ENABLED: "true"
      APP_SEED_DEMO_SCENARIOS_ENABLED: "false"
      APP_SEED_DEMO_REVIEWS_ENABLED: "false"
      APP_BOOTSTRAP_ADMIN_ENABLED: "false"
      APP_STATIC_MEDIA_MIGRATION_ENABLED: "false"
      APP_UPLOAD_STORAGE: local
      APP_UPLOAD_BASE_URL: http://localhost:19080/uploads
      APP_UPLOAD_DIR: /tmp/qa-uploads
      SEED_MEDIA_BASE_URL: http://localhost:19080
      # Public test-only keys. Never use these values for any deployed service.
      JWT_ACCESS_KEY: aXNvbGF0ZWQtcWEtYWNjZXNzLWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tMDAwMDAwMDAwMDAwMDAwMDAwMDAwMA==
      JWT_REFRESH_KEY: aXNvbGF0ZWQtcWEtcmVmcmVzaC1rZXktbm90LWZvci1wcm9kdWN0aW9uLTAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      REFUND_DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      VERIFICATION_SENDGRID_API_KEY: ""
      VERIFICATION_SENDGRID_FROM_EMAIL: qa@example.invalid
      GEMINI_API_KEY: ""
      SEPAY_RECONCILIATION_ENABLED: "false"
      SEPAY_WEBHOOK_HMAC_SECRET: isolated-qa-webhook-only
      SEPAY_WEBHOOK_API_KEY: ""
      SEPAY_API_ACCESS_TOKEN: ""
      MERCHANT_BANK_ACCOUNT_NUMBER: "0000000000"
      MERCHANT_BANK_CODE: MBBank
      MERCHANT_BANK_NAME: QA BANK
      MERCHANT_BANK_ACCOUNT_NAME: ISOLATED QA
      HOTEL_NAME: Isolated QA Hotel
      HOTEL_ADDRESS: QA only
      HOTEL_PHONE: "0000000000"
      HOTEL_EMAIL: qa@example.invalid
      HOTEL_TAX_CODE: QA
      PRICING_ENGINE_V2_ENABLED: "true"
      PRICING_ENGINE_V2_ROOM_TYPE_CODES: "*"
      PRICING_ENGINE_V2_REQUIRE_QUOTE: "true"
      DB_POOL_MAX_SIZE: "5"
      DB_POOL_MIN_IDLE: "0"
      DB_KEEPALIVE_TIME_MS: "0"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/actuator/health]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30
  proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:19080:8080"
    volumes:
      - ./scripts/qa-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [qa, edge]
    depends_on:
      backend:
        condition: service_healthy
networks:
  qa:
    internal: true
  edge:
volumes:
  qa-data:
